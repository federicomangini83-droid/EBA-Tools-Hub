    </header>

    <main class="container">

        <h1>Flat Data Model Creator</h1>

        <p class="subtitle">
            Local browser processing powered by Python.
        </p>

        <section class="card">

            <label for="fileInput">
                1. Upload the Excel workbook (.xlsx)
            </label>

            <input
                id="fileInput"
                type="file"
                accept=".xlsx"
            >

        </section>

        <section class="card">

            <label>
                2. Output settings
            </label>

            <div class="params">

                <div>
                    <label for="startName">
                        File prefix
                    </label>

                    <input
                        id="startName"
                        value="FR_"
                    >
                </div>

                <div>
                    <label for="fileNamePrefix">
                        File name
                    </label>

                    <input
                        id="fileNamePrefix"
                        value="TGK_MAPPING"
                    >
                </div>

                <div>
                    <label for="endName">
                        File suffix
                    </label>

                    <input
                        id="endName"
                        value="_420"
                    >
                </div>

            </div>

            <p class="hint">
                Generated file:
                <code id="fileNamePreview"></code>
            </p>

        </section>

        <section class="card action">

            <button
                id="processBtn"
                disabled
            >
                Process file
            </button>

            <span
                id="spinner"
                class="spinner hidden"
            ></span>

        </section>

        <section
            id="errorBox"
            class="error hidden"
        ></section>
