<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Flat Data Model Creator</title>

    ./css/style.css
</head>

<body>

    <header>
        <div class="topbar">
            ../../

            <span>
                Flat Data Model Creator
            </span>
        </div>
    </header>

    <main class="container">

        <h1>Flat Data Model Creator</h1>

        <p class="subtitle">
            Local browser processing powered by Python.
        </p>

        <section class="card">
            <label for="fileInput">
                1. Upload the Excel workbook (.xlsx)
            </label>

            <input
                id="fileInput"
                type="file"
                accept=".xlsx"
            >
        </section>

        <section class="card">

            <label>
                2. Output settings
            </label>

            <div class="params">

                <div>
                    <label for="startName">
                        File prefix
                    </label>

                    <input
                        id="startName"
                        value="FR_"
                    >
                </div>

                <div>
                    <label for="fileNamePrefix">
                        File name
                    </label>

                    <input
                        id="fileNamePrefix"
                        value="TGK_MAPPING"
                    >
                </div>

                <div>
                    <label for="endName">
                        File suffix
                    </label>

                    <input
                        id="endName"
                        value="_420"
                    >
                </div>

            </div>

            <p class="hint">
                Generated file:
                <code id="fileNamePreview"></code>
            </p>

        </section>

        <section class="card action">

            <button
                id="processBtn"
                disabled
            >
                Process file
            </button>

            <span
                id="spinner"
                class="spinner hidden"
            ></span>

        </section>

        <section
            id="errorBox"
            class="error hidden"
        ></section>

        <section
            id="resultBox"
            class="card hidden"
        >

            <h2>Result</h2>

            <p id="recordCount"></p>

            <div class="table-wrap">
                <table id="resultTable"></table>
            </div>

            <div class="buttons">

                <button
                    id="downloadBtn"
                    class="secondary"
                >
                    Download CSV
                </button>

                <button id="saveGithubBtn">
                    Save to GitHub storage
                </button>

            </div>

            <p
                id="archiveStatus"
                class="hint"
            ></p>

        </section>

        <section class="card">

            <div class="history-head">

                <div>
                    <h2>CSV history</h2>

                    <p class="hint">
                        Files stored in
                        <code>
                            storage/flat-data-model/
                        </code>.
                    </p>
                </div>

                <button
                    id="refreshHistoryBtn"
                    class="secondary"
                >
                    Refresh list
                </button>

            </div>

            <details>

                <summary>
                    GitHub configuration
                </summary>

                <div class="gh-grid">

                    <div>
                        <label>Owner</label>

                        <input
                            id="ghOwner"
                            value="federicomangini83-droid"
                        >
                    </div>

                    <div>
                        <label>Repository</label>

                        <input
                            id="ghRepo"
                            value="EBA-Tools-Hub"
                        >
                    </div>

                    <div>
                        <label>Branch</label>

                        <input
                            id="ghBranch"
                            value="main"
                        >
                    </div>

                    <div>
                        <label>Storage folder</label>

                        <input
                            id="ghFolder"
                            value="storage/flat-data-model"
                        >
                    </div>

                </div>

                <label>
                    GitHub token
                </label>

                <input
                    id="ghToken"
                    type="password"
                    placeholder="github_pat_..."
                >

                <label class="remember">

                    <input
                        id="ghRemember"
                        type="checkbox"
                    >

                    Remember the token in this browser

                </label>

            </details>

            <div
                id="historyError"
                class="error hidden"
            ></div>

            <div class="table-wrap">

                <table id="historyTable">

                    <thead>
                        <tr>
                            <th>File name</th>
                            <th>Size</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>

    js/app.js"></script>

</body>

</html>
